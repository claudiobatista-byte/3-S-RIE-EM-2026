<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexo — Geopolítica Mundial</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2e3244;
    --text: #e8eaf0;
    --muted: #7a7f96;
    --yellow-fill: #f0c040;
    --yellow-text: #3d2e00;
    --green-fill: #4caf7d;
    --green-text: #0d2b1a;
    --blue-fill: #4a90d9;
    --blue-text: #05172e;
    --purple-fill: #9b6dff;
    --purple-text: #1a0a3d;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  header p {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 0.4rem;
  }

  .subtitle-tag {
    display: inline-block;
    margin-top: 0.6rem;
    padding: 0.3rem 0.9rem;
    border-radius: 99px;
    background: #1e2240;
    border: 1px solid #3a3f6e;
    font-size: 0.78rem;
    color: #8a9fff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .lives {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 1.2rem;
    align-items: center;
  }

  .lives span {
    font-size: 0.85rem;
    color: var(--muted);
    margin-right: 6px;
  }

  .life-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #e05050;
    transition: background 0.3s;
  }

  .life-dot.lost {
    background: #2e3244;
  }

  .legend {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .legend-dot {
    width: 11px; height: 11px;
    border-radius: 3px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 680px;
    width: 100%;
    margin-bottom: 1.6rem;
  }

  .card {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 0.5rem;
    text-align: center;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
  }

  .card:hover:not(.solved):not(.wrong) {
    background: #2e3355;
    border-color: #5a6aff;
    transform: translateY(-2px);
  }

  .card.selected {
    background: #2d3460;
    border-color: #6677ff;
    transform: scale(1.04);
  }

  .card.wrong {
    animation: shake 0.4s ease;
    background: #3a1a1a;
    border-color: #e05050;
  }

  .card.solved {
    cursor: default;
    transform: none !important;
  }

  .card.color-yellow { background: var(--yellow-fill); color: var(--yellow-text); border-color: var(--yellow-fill); }
  .card.color-green  { background: var(--green-fill);  color: var(--green-text);  border-color: var(--green-fill); }
  .card.color-blue   { background: var(--blue-fill);   color: var(--blue-text);   border-color: var(--blue-fill); }
  .card.color-purple { background: var(--purple-fill); color: var(--purple-text); border-color: var(--purple-fill); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .solved-row {
    max-width: 680px;
    width: 100%;
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .solved-row.color-yellow { background: var(--yellow-fill); color: var(--yellow-text); }
  .solved-row.color-green  { background: var(--green-fill);  color: var(--green-text); }
  .solved-row.color-blue   { background: var(--blue-fill);   color: var(--blue-text); }
  .solved-row.color-purple { background: var(--purple-fill); color: var(--purple-text); }

  .solved-row .sr-category {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.75;
  }

  .solved-row .sr-words {
    font-size: 0.95rem;
    font-weight: 600;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    max-width: 680px;
    width: 100%;
  }

  button {
    padding: 0.55rem 1.4rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: #2e3355; border-color: #5a6aff; }

  button.primary {
    background: #3d48cc;
    border-color: #5a6aff;
    color: #fff;
  }

  button.primary:hover { background: #4a57e0; }
  button:disabled { opacity: 0.4; cursor: default; }

  .message {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.4rem;
    margin-bottom: 0.6rem;
    font-style: italic;
  }

  .message.good { color: #4caf7d; font-style: normal; font-weight: 600; }
  .message.bad  { color: #e05050; font-style: normal; font-weight: 600; }

  .endscreen {
    display: none;
    text-align: center;
    max-width: 500px;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 1rem;
  }

  .endscreen h2 { font-size: 1.6rem; margin-bottom: 0.6rem; }
  .endscreen p  { color: var(--muted); margin-bottom: 1.4rem; line-height: 1.6; }

  .score-badge {
    display: inline-block;
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0.8rem 0;
  }

  .difficulty-badge {
    display: inline-block;
    padding: 0.2rem 0.7rem;
    border-radius: 99px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-left: 6px;
    vertical-align: middle;
  }

  .diff-easy   { background: #f0c040; color: #3d2e00; }
  .diff-medium { background: #4caf7d; color: #0d2b1a; }
  .diff-hard   { background: #4a90d9; color: #05172e; }
  .diff-expert { background: #9b6dff; color: #1a0a3d; }

  .hints-area {
    max-width: 680px;
    width: 100%;
    margin-bottom: 1rem;
  }

  .hint-box {
    background: var(--surface);
    border: 1px solid #3a3f6e;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint-number {
    min-width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #3a3f7a;
    color: #9aaeff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .hint-text {
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.5;
  }

  .hint-text strong {
    color: #9aaeff;
    font-weight: 600;
  }

  .hint-warn {
    font-size: 0.75rem;
    color: #e0a040;
    margin-top: 3px;
  }

  .btn-hint {
    background: #1e2345;
    border-color: #3a3f6e;
    color: #9aaeff;
  }

  .btn-hint:hover { background: #2a2f5a; border-color: #6677ff; }
  .btn-hint:disabled { opacity: 0.35; }

  @media (max-width: 500px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .card { font-size: 0.72rem; padding: 0.7rem 0.3rem; min-height: 58px; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Conexo</h1>
  <p>Forme 4 grupos de 4 palavras com algo em comum.</p>
  <div class="subtitle-tag">🌍 Geopolítica Mundial</div>
</header>

<div class="lives">
  <span>Tentativas:</span>
  <div class="life-dot" id="l1"></div>
  <div class="life-dot" id="l2"></div>
  <div class="life-dot" id="l3"></div>
  <div class="life-dot" id="l4"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#f0c040"></div>Fácil</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4caf7d"></div>Médio</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div>Difícil</div>
  <div class="legend-item"><div class="legend-dot" style="background:#9b6dff"></div>Especialista</div>
</div>

<div id="solved-area"></div>

<div class="grid" id="grid"></div>

<div class="message" id="message"></div>

<div class="actions">
  <button onclick="shuffleGrid()">Embaralhar</button>
  <button onclick="clearSelection()">Limpar seleção</button>
  <button class="btn-hint" id="btn-dica" onclick="showNextHint()">💡 Dica</button>
  <button class="primary" id="btn-confirmar" onclick="confirmSelection()" disabled>Confirmar</button>
</div>

<div class="hints-area" id="hints-area"></div>

<div class="endscreen" id="endscreen">
  <h2 id="end-title"></h2>
  <div class="score-badge" id="end-score"></div>
  <p id="end-text"></p>
  <button class="primary" onclick="resetGame()">Jogar novamente</button>
</div>

<script>
const ROUNDS = [
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos mistura países e conceitos ligados à <em>Guerra Fria</em> — pense em divisões ideológicas, corrida armamentista e disputas de influência entre superpotências.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo formado por termos que descrevem <em>tipos de regime político</em> — não são países, são formas de governo ou sistemas de poder que você encontra em qualquer livro de Ciência Política.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      {
        category: "Associados à Guerra Fria",
        color: "yellow",
        words: ["Détente", "URSS", "Cortina de Ferro", "Corrida Espacial"]
      },
      {
        category: "Tipos de regime político",
        color: "green",
        words: ["Teocracia", "Oligarquia", "Autocracia", "Plutocracia"]
      },
      {
        category: "Membros fundadores da OTAN (1949)",
        color: "blue",
        words: ["Canadá", "Noruega", "Portugal", "Bélgica"]
      },
      {
        category: "Conceitos de soberania e território",
        color: "purple",
        words: ["Diáspora", "Extraterritorialidade", "Zona de Influência", "Estado-tampão"]
      }
    ]
  },
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos reúne palavras ligadas a <em>conflitos e segurança internacional</em> — incluindo termos técnicos usados em tratados, estratégias militares e diplomacia de crise.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo formado por países e conceitos relacionados ao <em>Oriente Médio atual</em> — pense em atores estatais e não-estatais, disputas energéticas e alianças regionais.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      {
        category: "Termos de segurança internacional",
        color: "yellow",
        words: ["Dissuasão", "Proxy", "Sanção", "Embargo"]
      },
      {
        category: "Relacionados ao Oriente Médio atual",
        color: "green",
        words: ["Hezbollah", "Arábia Saudita", "Estreito de Ormuz", "Irã"]
      },
      {
        category: "Países que aderiram à UE após 2004",
        color: "blue",
        words: ["Polônia", "Romênia", "Bulgária", "Croácia"]
      },
      {
        category: "Conceitos de economia política global",
        color: "purple",
        words: ["Dumping", "Protecionismo", "Balança Comercial", "Petrodólar"]
      }
    ]
  },
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos mistura países e organizações ligados ao conceito de <em>Sul Global</em> — nações em desenvolvimento que buscam maior protagonismo na ordem mundial multipolar.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo com termos que descrevem <em>fenômenos geopolíticos recentes</em> — processos que marcaram as últimas duas décadas, como o avanço autoritário, a desglobalização e as novas guerras híbridas.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      {
        category: "Associados ao Sul Global / multipolaridade",
        color: "yellow",
        words: ["BRICS", "Índia", "G77", "Não-Alinhamento"]
      },
      {
        category: "Fenômenos geopolíticos do século XXI",
        color: "green",
        words: ["Desglobalização", "Guerra Híbrida", "Lawfare", "Populismo"]
      },
      {
        category: "Países com maior reserva de água doce",
        color: "blue",
        words: ["Brasil", "Rússia", "Canadá", "China"]
      },
      {
        category: "Conceitos de direito internacional",
        color: "purple",
        words: ["Jus Cogens", "Refugiado", "Intervenção Humanitária", "Veto"]
      }
    ]
  }
];

let currentRound, groups, hints, words, selected, lives, solvedGroups, gameOver, hintsShown;

function initGame(roundIndex) {
  const round = ROUNDS[roundIndex % ROUNDS.length];
  groups = round.groups;
  hints = round.hints;

  words = [];
  groups.forEach(g => {
    g.words.forEach(w => words.push({ word: w, group: g }));
  });

  selected = [];
  lives = 4;
  solvedGroups = [];
  gameOver = false;
  hintsShown = 0;

  updateLives();
  document.getElementById("solved-area").innerHTML = "";
  document.getElementById("hints-area").innerHTML = "";
  document.getElementById("endscreen").style.display = "none";
  document.getElementById("grid").style.display = "grid";
  document.getElementById("message").textContent = "";
  document.getElementById("message").className = "message";
  document.getElementById("btn-confirmar").disabled = true;
  document.getElementById("btn-dica").disabled = false;
  document.getElementById("btn-dica").textContent = "💡 Dica (2 disponíveis)";

  shuffleWords();
  renderGrid();
}

function showNextHint() {
  if (gameOver || hintsShown >= hints.length) return;

  const hint = hints[hintsShown];

  if (hint.warn && lives <= 1) {
    setMessage("Sem tentativas suficientes para usar esta dica!", "bad");
    return;
  }

  if (hint.warn) {
    lives--;
    updateLives();
  }

  hintsShown++;

  const area = document.getElementById("hints-area");
  const box = document.createElement("div");
  box.className = "hint-box";
  box.innerHTML = `
    <div class="hint-number">${hintsShown}</div>
    <div>
      <div class="hint-text">${hint.text}</div>
      ${hint.warn ? `<div class="hint-warn">${hint.warn} (já descontada)</div>` : ""}
    </div>`;
  area.appendChild(box);

  const remaining = hints.length - hintsShown;
  const btn = document.getElementById("btn-dica");
  if (remaining === 0) {
    btn.disabled = true;
    btn.textContent = "💡 Sem mais dicas";
  } else {
    btn.textContent = `💡 Próxima dica (${remaining} restante${remaining > 1 ? "s" : ""})`;
    if (hints[hintsShown].warn) {
      btn.textContent += " — custa 1 vida";
    }
  }
}

function shuffleWords() {
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [words[i], words[j]] = [words[j], words[i]];
  }
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  words.forEach((item, idx) => {
    if (solvedGroups.includes(item.group)) return;
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = item.word;
    card.dataset.idx = idx;
    if (selected.includes(idx)) card.classList.add("selected");
    card.onclick = () => toggleCard(idx, card);
    grid.appendChild(card);
  });
}

function toggleCard(idx, el) {
  if (gameOver) return;
  if (selected.includes(idx)) {
    selected = selected.filter(i => i !== idx);
    el.classList.remove("selected");
  } else {
    if (selected.length >= 4) return;
    selected.push(idx);
    el.classList.add("selected");
  }
  document.getElementById("btn-confirmar").disabled = selected.length !== 4;
  setMessage("");
}

function clearSelection() {
  selected = [];
  renderGrid();
  document.getElementById("btn-confirmar").disabled = true;
}

function shuffleGrid() {
  shuffleWords();
  selected = [];
  renderGrid();
  document.getElementById("btn-confirmar").disabled = true;
}

function confirmSelection() {
  if (selected.length !== 4) return;

  const selectedGroups = selected.map(i => words[i].group);
  const allSame = selectedGroups.every(g => g === selectedGroups[0]);

  if (allSame) {
    const group = selectedGroups[0];
    solvedGroups.push(group);

    const close = selected.some((i, _, arr) =>
      words[i].group !== group
    );

    addSolvedRow(group);
    words = words.filter(w => !group.words.includes(w.word));
    selected = [];
    renderGrid();
    document.getElementById("btn-confirmar").disabled = true;
    setMessage("Correto! 🎉", "good");

    if (solvedGroups.length === groups.length) {
      setTimeout(() => showEnd(true), 600);
    }
  } else {
    lives--;
    updateLives();

    const cards = document.querySelectorAll(".card.selected");
    cards.forEach(c => {
      c.classList.remove("selected");
      c.classList.add("wrong");
      setTimeout(() => { c.classList.remove("wrong"); }, 500);
    });

    const oneAway = checkOneAway();
    if (oneAway) setMessage("Quase! Você errou apenas 1 palavra.", "bad");
    else setMessage("Errou! Tente outra combinação.", "bad");

    selected = [];
    document.getElementById("btn-confirmar").disabled = true;

    if (lives === 0) {
      setTimeout(() => showEnd(false), 600);
    }
  }
}

function checkOneAway() {
  for (const group of groups) {
    if (solvedGroups.includes(group)) continue;
    const matches = selected.filter(i => group.words.includes(words[i]?.word)).length;
    if (matches === 3) return true;
  }
  return false;
}

function addSolvedRow(group) {
  const area = document.getElementById("solved-area");
  const row = document.createElement("div");
  row.className = `solved-row color-${group.color}`;
  row.innerHTML = `<div class="sr-category">${group.category}</div><div class="sr-words">${group.words.join(" · ")}</div>`;
  area.appendChild(row);
}

function updateLives() {
  for (let i = 1; i <= 4; i++) {
    const dot = document.getElementById("l" + i);
    dot.classList.toggle("lost", i > lives);
  }
}

function setMessage(text, type) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "message" + (type ? ` ${type}` : "");
}

function showEnd(won) {
  gameOver = true;
  document.getElementById("grid").style.display = "none";
  const end = document.getElementById("endscreen");
  end.style.display = "block";

  if (won) {
    const erros = 4 - lives;
    document.getElementById("end-title").textContent = "Parabéns! 🌍";
    document.getElementById("end-score").textContent = erros === 0 ? "Perfeito!" : `${erros} erro${erros > 1 ? "s" : ""}`;
    document.getElementById("end-text").textContent =
      erros === 0
        ? "Você acertou todos os grupos sem errar nenhuma vez! Domínio total da geopolítica!"
        : `Você completou o desafio com ${erros} erro${erros > 1 ? "s" : ""}. Continue estudando geopolítica!`;
  } else {
    document.getElementById("end-title").textContent = "Fim de jogo 😔";
    document.getElementById("end-score").textContent = "0 grupos restantes";
    document.getElementById("end-text").textContent =
      "Você usou todas as tentativas. Reveja os grupos abaixo e tente novamente!";
    groups.filter(g => !solvedGroups.includes(g)).forEach(g => addSolvedRow(g));
  }
}

let currentRoundIndex = 0;

function resetGame() {
  currentRoundIndex = (currentRoundIndex + 1) % ROUNDS.length;
  initGame(currentRoundIndex);
}

initGame(0);
</script>
</body>
</html>
