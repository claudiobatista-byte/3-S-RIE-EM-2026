<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexo — Geopolítica Mundial</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #252836;
    --border: #2e3244;
    --text: #e8eaf0;
    --muted: #7a7f96;
    --yellow-fill: #f0c040;
    --yellow-text: #3d2e00;
    --green-fill: #4caf7d;
    --green-text: #0d2b1a;
    --blue-fill: #4a90d9;
    --blue-text: #05172e;
    --purple-fill: #9b6dff;
    --purple-text: #1a0a3d;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
  }

  /* ── TELA DE ENTRADA ── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    width: 100%;
    max-width: 440px;
    text-align: center;
    gap: 0;
  }

  .login-globe {
    font-size: 4rem;
    margin-bottom: 1.2rem;
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .login-title {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .login-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 2rem 1.8rem;
    width: 100%;
  }

  .login-card label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
    text-align: left;
  }

  .login-card input[type="text"] {
    width: 100%;
    padding: 0.75rem 1rem;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 1rem;
    font-weight: 600;
    outline: none;
    margin-bottom: 1.4rem;
    transition: border-color 0.2s;
  }

  .login-card input[type="text"]:focus {
    border-color: #6677ff;
  }

  .login-card input[type="text"]::placeholder {
    color: var(--muted);
    font-weight: 400;
  }

  .btn-start {
    width: 100%;
    padding: 0.8rem;
    border-radius: 10px;
    border: none;
    background: #3d48cc;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.1s;
  }

  .btn-start:hover  { background: #4a57e0; }
  .btn-start:active { transform: scale(0.98); }

  .login-hint {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 1rem;
  }

  /* ── JOGO ── */
  #game-screen { display: none; flex-direction: column; align-items: center; width: 100%; }

  header { text-align: center; margin-bottom: 1.2rem; }

  header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  header p { font-size: 0.9rem; color: var(--muted); margin-top: 0.3rem; }

  .subtitle-tag {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.3rem 0.9rem;
    border-radius: 99px;
    background: #1e2240;
    border: 1px solid #3a3f6e;
    font-size: 0.78rem;
    color: #8a9fff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .player-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 0.6rem;
    padding: 0.3rem 0.9rem;
    border-radius: 99px;
    background: #1e2e20;
    border: 1px solid #2e5a34;
    font-size: 0.82rem;
    color: #6dcc88;
    font-weight: 600;
  }

  .lives {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 1.2rem;
    align-items: center;
  }

  .lives span { font-size: 0.85rem; color: var(--muted); margin-right: 6px; }

  .life-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #e05050;
    transition: background 0.3s;
  }
  .life-dot.lost { background: #2e3244; }

  .legend {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.4rem;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); }
  .legend-dot  { width: 11px; height: 11px; border-radius: 3px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    max-width: 680px;
    width: 100%;
    margin-bottom: 1.6rem;
  }

  .card {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 0.5rem;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: transform 0.12s, background 0.15s, border-color 0.15s;
    min-height: 68px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1.3;
  }

  .card:hover:not(.wrong) { background: #2e3355; border-color: #5a6aff; transform: translateY(-2px); }
  .card.selected { background: #2d3460; border-color: #6677ff; transform: scale(1.04); }
  .card.wrong { animation: shake 0.4s ease; background: #3a1a1a; border-color: #e05050; }

  .card.color-yellow { background: var(--yellow-fill); color: var(--yellow-text); border-color: var(--yellow-fill); }
  .card.color-green  { background: var(--green-fill);  color: var(--green-text);  border-color: var(--green-fill); }
  .card.color-blue   { background: var(--blue-fill);   color: var(--blue-text);   border-color: var(--blue-fill); }
  .card.color-purple { background: var(--purple-fill); color: var(--purple-text); border-color: var(--purple-fill); }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .solved-row {
    max-width: 680px;
    width: 100%;
    border-radius: 10px;
    padding: 0.9rem 1.2rem;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .solved-row.color-yellow { background: var(--yellow-fill); color: var(--yellow-text); }
  .solved-row.color-green  { background: var(--green-fill);  color: var(--green-text); }
  .solved-row.color-blue   { background: var(--blue-fill);   color: var(--blue-text); }
  .solved-row.color-purple { background: var(--purple-fill); color: var(--purple-text); }

  .solved-row .sr-category {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.75;
  }

  .solved-row .sr-words { font-size: 0.95rem; font-weight: 600; }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1rem;
    max-width: 680px;
    width: 100%;
  }

  button {
    padding: 0.55rem 1.4rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: #2e3355; border-color: #5a6aff; }

  button.primary { background: #3d48cc; border-color: #5a6aff; color: #fff; }
  button.primary:hover { background: #4a57e0; }
  button:disabled { opacity: 0.4; cursor: default; }

  .btn-hint { background: #1e2345; border-color: #3a3f6e; color: #9aaeff; }
  .btn-hint:hover { background: #2a2f5a; border-color: #6677ff; }

  .message {
    text-align: center;
    font-size: 0.9rem;
    color: var(--muted);
    min-height: 1.4rem;
    margin-bottom: 0.6rem;
    font-style: italic;
  }

  .message.good { color: #4caf7d; font-style: normal; font-weight: 600; }
  .message.bad  { color: #e05050; font-style: normal; font-weight: 600; }

  .hints-area { max-width: 680px; width: 100%; margin-bottom: 1rem; }

  .hint-box {
    background: var(--surface);
    border: 1px solid #3a3f6e;
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint-number {
    min-width: 24px; height: 24px;
    border-radius: 50%;
    background: #3a3f7a;
    color: #9aaeff;
    font-size: 0.75rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .hint-text { font-size: 0.88rem; color: var(--text); line-height: 1.5; }
  .hint-text strong { color: #9aaeff; font-weight: 600; }
  .hint-warn { font-size: 0.75rem; color: #e0a040; margin-top: 3px; }

  /* ── FIM DE JOGO ── */
  .endscreen {
    display: none;
    text-align: center;
    max-width: 520px;
    width: 100%;
    padding: 2.5rem 2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    margin-top: 1rem;
  }

  .endscreen h2 { font-size: 1.6rem; margin-bottom: 0.5rem; }
  .endscreen .end-player { font-size: 1rem; color: #6dcc88; font-weight: 600; margin-bottom: 0.4rem; }
  .endscreen p  { color: var(--muted); margin-bottom: 1.2rem; line-height: 1.6; }

  .score-badge { display: inline-block; font-size: 2.5rem; font-weight: 700; margin: 0.6rem 0; }

  .end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }

  /* ── CARD PARA EXPORTAR ── */
  #export-card {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 600px;
    background: #0f1117;
    padding: 36px 40px 40px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #e8eaf0;
  }

  #export-card .ec-header {
    text-align: center;
    margin-bottom: 24px;
    border-bottom: 1px solid #2e3244;
    padding-bottom: 20px;
  }

  #export-card .ec-title {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  #export-card .ec-subtitle { font-size: 0.8rem; color: #7a7f96; }

  #export-card .ec-player {
    font-size: 1rem;
    font-weight: 700;
    color: #6dcc88;
    margin: 10px 0 2px;
  }

  #export-card .ec-result { font-size: 1.4rem; font-weight: 800; margin-bottom: 4px; }
  #export-card .ec-detail { font-size: 0.85rem; color: #7a7f96; margin-bottom: 20px; }

  #export-card .ec-group {
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
  }

  #export-card .ec-group-cat {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    opacity: 0.7;
    margin-bottom: 2px;
  }

  #export-card .ec-group-words { font-size: 0.9rem; font-weight: 600; }
  #export-card .ec-group.color-yellow { background: #f0c040; color: #3d2e00; }
  #export-card .ec-group.color-green  { background: #4caf7d; color: #0d2b1a; }
  #export-card .ec-group.color-blue   { background: #4a90d9; color: #05172e; }
  #export-card .ec-group.color-purple { background: #9b6dff; color: #1a0a3d; }

  #export-card .ec-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.72rem;
    color: #3a3f6e;
    border-top: 1px solid #2e3244;
    padding-top: 14px;
  }

  @media (max-width: 500px) {
    .grid { gap: 7px; }
    .card { font-size: 0.72rem; padding: 0.7rem 0.3rem; min-height: 58px; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- ═══ TELA DE ENTRADA ═══ -->
<div id="login-screen">
  <div class="login-globe">🌍</div>
  <div class="login-title">Conexo</div>
  <div class="login-sub">Geopolítica Mundial</div>

  <div class="login-card">
    <label for="input-nome">Seu nome</label>
    <input type="text" id="input-nome" placeholder="Ex: Maria Silva" maxlength="40" autocomplete="off" />
    <button class="btn-start" onclick="startGame()">Começar a jogar</button>
    <div class="login-hint">Forme 4 grupos de 4 palavras com algo em comum.</div>
  </div>
</div>

<!-- ═══ TELA DO JOGO ═══ -->
<div id="game-screen">

  <header>
    <h1>Conexo</h1>
    <p>Forme 4 grupos de 4 palavras com algo em comum.</p>
    <div class="subtitle-tag">🌍 Geopolítica Mundial</div><br>
    <div class="player-tag">👤 <span id="player-name-tag"></span></div>
  </header>

  <div class="lives">
    <span>Tentativas:</span>
    <div class="life-dot" id="l1"></div>
    <div class="life-dot" id="l2"></div>
    <div class="life-dot" id="l3"></div>
    <div class="life-dot" id="l4"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#f0c040"></div>Fácil</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4caf7d"></div>Médio</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div>Difícil</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9b6dff"></div>Especialista</div>
  </div>

  <div id="solved-area"></div>
  <div class="grid" id="grid"></div>
  <div class="message" id="message"></div>

  <div class="actions">
    <button onclick="shuffleGrid()">Embaralhar</button>
    <button onclick="clearSelection()">Limpar seleção</button>
    <button class="btn-hint" id="btn-dica" onclick="showNextHint()">💡 Dica (2 disponíveis)</button>
    <button class="primary" id="btn-confirmar" onclick="confirmSelection()" disabled>Confirmar</button>
  </div>

  <div class="hints-area" id="hints-area"></div>

  <!-- Tela de fim de jogo -->
  <div class="endscreen" id="endscreen">
    <h2 id="end-title"></h2>
    <div class="end-player" id="end-player"></div>
    <div class="score-badge" id="end-score"></div>
    <p id="end-text"></p>
    <div class="end-actions">
      <button onclick="saveImage()" id="btn-salvar">📸 Salvar resultado</button>
      <button class="primary" onclick="resetGame()">Jogar novamente</button>
    </div>
  </div>

</div>

<!-- ═══ CARD OCULTO PARA EXPORTAR ═══ -->
<div id="export-card">
  <div class="ec-header">
    <div class="ec-title">🌍 Conexo</div>
    <div class="ec-subtitle">Geopolítica Mundial</div>
    <div class="ec-player" id="ec-player"></div>
    <div class="ec-result" id="ec-result"></div>
    <div class="ec-detail" id="ec-detail"></div>
  </div>
  <div id="ec-groups"></div>
  <div class="ec-footer">Jogo gerado para fins educacionais · Conexo Geopolítica</div>
</div>

<script>
let playerName = "";

function startGame() {
  const input = document.getElementById("input-nome").value.trim();
  if (!input) {
    document.getElementById("input-nome").focus();
    document.getElementById("input-nome").style.borderColor = "#e05050";
    setTimeout(() => document.getElementById("input-nome").style.borderColor = "", 800);
    return;
  }
  playerName = input;
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("game-screen").style.display = "flex";
  document.getElementById("player-name-tag").textContent = playerName;
  initGame(0);
}

document.getElementById("input-nome").addEventListener("keydown", e => {
  if (e.key === "Enter") startGame();
});

/* ═══ DADOS ═══ */
const ROUNDS = [
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos mistura países e conceitos ligados à <em>Guerra Fria</em> — pense em divisões ideológicas, corrida armamentista e disputas de influência entre superpotências.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo formado por termos que descrevem <em>tipos de regime político</em> — não são países, são formas de governo que você encontra em qualquer livro de Ciência Política.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      { category: "Associados à Guerra Fria", color: "yellow", words: ["Détente", "URSS", "Cortina de Ferro", "Corrida Espacial"] },
      { category: "Tipos de regime político", color: "green", words: ["Teocracia", "Oligarquia", "Autocracia", "Plutocracia"] },
      { category: "Membros fundadores da OTAN (1949)", color: "blue", words: ["Canadá", "Noruega", "Portugal", "Bélgica"] },
      { category: "Conceitos de soberania e território", color: "purple", words: ["Diáspora", "Extraterritorialidade", "Zona de Influência", "Estado-tampão"] }
    ]
  },
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos reúne palavras ligadas a <em>conflitos e segurança internacional</em> — incluindo termos técnicos usados em tratados, estratégias militares e diplomacia de crise.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo formado por países e conceitos relacionados ao <em>Oriente Médio atual</em> — pense em atores estatais e não-estatais, disputas energéticas e alianças regionais.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      { category: "Termos de segurança internacional", color: "yellow", words: ["Dissuasão", "Proxy", "Sanção", "Embargo"] },
      { category: "Relacionados ao Oriente Médio atual", color: "green", words: ["Hezbollah", "Arábia Saudita", "Estreito de Ormuz", "Irã"] },
      { category: "Países que aderiram à UE após 2004", color: "blue", words: ["Polônia", "Romênia", "Bulgária", "Croácia"] },
      { category: "Conceitos de economia política global", color: "purple", words: ["Dumping", "Protecionismo", "Balança Comercial", "Petrodólar"] }
    ]
  },
  {
    hints: [
      { text: "<strong>Dica 1:</strong> Um dos grupos mistura países e organizações ligados ao <em>Sul Global</em> — nações em desenvolvimento que buscam maior protagonismo na ordem mundial multipolar.", warn: null },
      { text: "<strong>Dica 2:</strong> Há um grupo com termos que descrevem <em>fenômenos geopolíticos recentes</em> — processos que marcaram as últimas duas décadas, como o avanço autoritário e as guerras híbridas.", warn: "⚠️ Esta dica custa 1 tentativa." }
    ],
    groups: [
      { category: "Associados ao Sul Global / multipolaridade", color: "yellow", words: ["BRICS", "Índia", "G77", "Não-Alinhamento"] },
      { category: "Fenômenos geopolíticos do século XXI", color: "green", words: ["Desglobalização", "Guerra Híbrida", "Lawfare", "Populismo"] },
      { category: "Países com maior reserva de água doce", color: "blue", words: ["Brasil", "Rússia", "Canadá", "China"] },
      { category: "Conceitos de direito internacional", color: "purple", words: ["Jus Cogens", "Refugiado", "Intervenção Humanitária", "Veto"] }
    ]
  }
];

/* ═══ ESTADO ═══ */
let groups, hints, words, selected, lives, solvedGroups, gameOver, hintsShown, currentRoundIndex, finalWon, finalErros;

function initGame(roundIndex) {
  currentRoundIndex = roundIndex;
  const round = ROUNDS[roundIndex % ROUNDS.length];
  groups = round.groups;
  hints  = round.hints;

  words = [];
  groups.forEach(g => g.words.forEach(w => words.push({ word: w, group: g })));

  selected = []; lives = 4; solvedGroups = []; gameOver = false; hintsShown = 0;

  updateLives();
  document.getElementById("solved-area").innerHTML = "";
  document.getElementById("hints-area").innerHTML  = "";
  document.getElementById("endscreen").style.display = "none";
  document.getElementById("grid").style.display = "grid";
  document.getElementById("message").textContent = "";
  document.getElementById("message").className   = "message";
  document.getElementById("btn-confirmar").disabled = true;
  document.getElementById("btn-dica").disabled = false;
  document.getElementById("btn-dica").textContent = "💡 Dica (2 disponíveis)";

  shuffleWords();
  renderGrid();
}

function showNextHint() {
  if (gameOver || hintsShown >= hints.length) return;
  const hint = hints[hintsShown];
  if (hint.warn && lives <= 1) { setMessage("Sem tentativas suficientes para esta dica!", "bad"); return; }
  if (hint.warn) { lives--; updateLives(); }
  hintsShown++;
  const area = document.getElementById("hints-area");
  const box  = document.createElement("div");
  box.className = "hint-box";
  box.innerHTML = `<div class="hint-number">${hintsShown}</div><div><div class="hint-text">${hint.text}</div>${hint.warn ? `<div class="hint-warn">${hint.warn} (já descontada)</div>` : ""}</div>`;
  area.appendChild(box);
  const remaining = hints.length - hintsShown;
  const btn = document.getElementById("btn-dica");
  if (remaining === 0) { btn.disabled = true; btn.textContent = "💡 Sem mais dicas"; }
  else { btn.textContent = `💡 Próxima dica (${remaining} restante${remaining > 1 ? "s" : ""})${hints[hintsShown].warn ? " — custa 1 vida" : ""}`; }
}

function shuffleWords() {
  for (let i = words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [words[i], words[j]] = [words[j], words[i]];
  }
}

function renderGrid() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  words.forEach((item, idx) => {
    if (solvedGroups.includes(item.group)) return;
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = item.word;
    card.dataset.idx = idx;
    if (selected.includes(idx)) card.classList.add("selected");
    card.onclick = () => toggleCard(idx, card);
    grid.appendChild(card);
  });
}

function toggleCard(idx, el) {
  if (gameOver) return;
  if (selected.includes(idx)) { selected = selected.filter(i => i !== idx); el.classList.remove("selected"); }
  else { if (selected.length >= 4) return; selected.push(idx); el.classList.add("selected"); }
  document.getElementById("btn-confirmar").disabled = selected.length !== 4;
  setMessage("");
}

function clearSelection() { selected = []; renderGrid(); document.getElementById("btn-confirmar").disabled = true; }
function shuffleGrid()    { shuffleWords(); selected = []; renderGrid(); document.getElementById("btn-confirmar").disabled = true; }

function confirmSelection() {
  if (selected.length !== 4) return;
  const selectedGroups = selected.map(i => words[i].group);
  const allSame = selectedGroups.every(g => g === selectedGroups[0]);

  if (allSame) {
    const group = selectedGroups[0];
    solvedGroups.push(group);
    addSolvedRow(group);
    words = words.filter(w => !group.words.includes(w.word));
    selected = [];
    renderGrid();
    document.getElementById("btn-confirmar").disabled = true;
    setMessage("Correto! 🎉", "good");
    if (solvedGroups.length === groups.length) setTimeout(() => showEnd(true), 600);
  } else {
    lives--;
    updateLives();
    document.querySelectorAll(".card.selected").forEach(c => {
      c.classList.remove("selected"); c.classList.add("wrong");
      setTimeout(() => c.classList.remove("wrong"), 500);
    });
    const oneAway = checkOneAway();
    setMessage(oneAway ? "Quase! Você errou apenas 1 palavra." : "Errou! Tente outra combinação.", "bad");
    selected = [];
    document.getElementById("btn-confirmar").disabled = true;
    if (lives === 0) setTimeout(() => showEnd(false), 600);
  }
}

function checkOneAway() {
  for (const group of groups) {
    if (solvedGroups.includes(group)) continue;
    if (selected.filter(i => group.words.includes(words[i]?.word)).length === 3) return true;
  }
  return false;
}

function addSolvedRow(group) {
  const area = document.getElementById("solved-area");
  const row  = document.createElement("div");
  row.className = `solved-row color-${group.color}`;
  row.innerHTML  = `<div class="sr-category">${group.category}</div><div class="sr-words">${group.words.join(" · ")}</div>`;
  area.appendChild(row);
}

function updateLives() {
  for (let i = 1; i <= 4; i++)
    document.getElementById("l" + i).classList.toggle("lost", i > lives);
}

function setMessage(text, type) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.className = "message" + (type ? ` ${type}` : "");
}

function showEnd(won) {
  gameOver = true;
  finalWon  = won;
  finalErros = 4 - lives;

  document.getElementById("grid").style.display = "none";
  const end = document.getElementById("endscreen");
  end.style.display = "block";

  document.getElementById("end-player").textContent = `Jogador: ${playerName}`;

  if (won) {
    document.getElementById("end-title").textContent = "Parabéns! 🌍";
    document.getElementById("end-score").textContent = finalErros === 0 ? "Perfeito!" : `${finalErros} erro${finalErros > 1 ? "s" : ""}`;
    document.getElementById("end-text").textContent  =
      finalErros === 0 ? "Você acertou tudo sem errar nenhuma vez! Domínio total da geopolítica!"
                       : `Você completou o desafio com ${finalErros} erro${finalErros > 1 ? "s" : ""}. Continue estudando!`;
  } else {
    document.getElementById("end-title").textContent = "Fim de jogo 😔";
    document.getElementById("end-score").textContent = `${solvedGroups.length} de 4 grupos`;
    document.getElementById("end-text").textContent  = "Você usou todas as tentativas. Veja os grupos corretos abaixo e tente novamente!";
    groups.filter(g => !solvedGroups.includes(g)).forEach(g => addSolvedRow(g));
  }
}

function resetGame() {
  currentRoundIndex = (currentRoundIndex + 1) % ROUNDS.length;
  initGame(currentRoundIndex);
}

/* ═══ SALVAR COMO IMAGEM ═══ */
function saveImage() {
  const btn = document.getElementById("btn-salvar");
  btn.textContent = "⏳ Gerando imagem...";
  btn.disabled = true;

  // Preenche o card oculto
  document.getElementById("ec-player").textContent = `👤 ${playerName}`;

  const won = finalWon;
  const erros = finalErros;
  document.getElementById("ec-result").textContent =
    won ? (erros === 0 ? "✅ Perfeito — sem erros!" : `✅ Concluído com ${erros} erro${erros > 1 ? "s" : ""}`)
        : `❌ ${solvedGroups.length} de 4 grupos acertados`;

  const rodada = (currentRoundIndex % ROUNDS.length) + 1;
  document.getElementById("ec-detail").textContent = `Rodada ${rodada} · ${new Date().toLocaleDateString("pt-BR")}`;

  const container = document.getElementById("ec-groups");
  container.innerHTML = "";
  groups.forEach(g => {
    const div = document.createElement("div");
    div.className = `ec-group color-${g.color}`;
    div.innerHTML = `<div class="ec-group-cat">${g.category}</div><div class="ec-group-words">${g.words.join(" · ")}</div>`;
    container.appendChild(div);
  });

  const card = document.getElementById("export-card");
  card.style.left = "-9999px";
  card.style.top  = "0";

  setTimeout(() => {
    html2canvas(card, { backgroundColor: "#0f1117", scale: 2, useCORS: true, logging: false })
      .then(canvas => {
        const link = document.createElement("a");
        link.download = `conexo-${playerName.replace(/\s+/g, "_")}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        btn.textContent = "📸 Salvar resultado";
        btn.disabled = false;
      })
      .catch(() => {
        alert("Não foi possível gerar a imagem. Tente tirar um print manual.");
        btn.textContent = "📸 Salvar resultado";
        btn.disabled = false;
      });
  }, 100);
}
</script>
